<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Paz Wir</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="game-panel" aria-label="Juego La Paz Wir">
      <div class="hud">
        <div class="hud-main">
          <div class="hud-score">
            <span class="hud-label">Puntos</span>
            <strong id="score">0</strong>
          </div>
          <div class="hud-life">
            <span class="hud-label">Vida</span>
            <div class="life-meter" role="meter" aria-label="Vida del jugador" aria-valuemin="0" aria-valuemax="300" aria-valuenow="300">
              <div id="lifeBar" class="life-meter-fill"></div>
            </div>
            <strong id="lifeValue">300/300</strong>
          </div>
        </div>

        <div class="hud-subheader">
          <div class="hud-time">
            <span class="hud-label">Tiempo</span>
            <strong id="timeValue">0:00</strong>
          </div>
          <div class="hud-cooldown">
            <span class="hud-label">Chicote</span>
            <div class="cooldown-meter" role="meter" aria-label="Recarga del chicote" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div id="attackCooldownBar" class="cooldown-meter-fill"></div>
            </div>
          </div>
        </div>

        <div class="hud-audio" aria-label="Audio">
          <button id="muteButton" type="button" class="audio-mute" aria-pressed="false">Audio</button>
          <label class="audio-slider">
            <span class="hud-label">Musica</span>
            <input id="musicVolume" type="range" min="0" max="100" value="24">
          </label>
          <label class="audio-slider">
            <span class="hud-label">SFX</span>
            <input id="sfxVolume" type="range" min="0" max="100" value="15">
          </label>
        </div>
      </div>

      <canvas id="game" width="390" height="690"></canvas>

      <div id="overlay" class="overlay">
        <h1>La Paz Wir</h1>
        <p>Avanza por el mapa del Teleferico, salta barricadas y usa el chicote para abrirte paso entre oleadas de caos urbano.</p>
        <button id="startButton" type="button">Jugar</button>
      </div>

      <div class="controls" aria-label="Controles">
        <button id="leftButton" type="button" aria-label="Mover izquierda">&lsaquo;</button>
        <button id="rightButton" type="button" aria-label="Mover derecha">&rsaquo;</button>
        <button id="jumpButton" type="button" aria-label="Saltar">&uarr;</button>
        <button id="attackButton" type="button" aria-label="Usar chicote">&#9673;</button>
      </div>
    </section>
  </main>

  <script type="module" src="src/main.mjs"></script>
</body>
</html>
